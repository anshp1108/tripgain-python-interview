# Tripgain Gemini Integration - Configuration File

[API]
# Get your free Google API key from: https://ai.google.dev/
# Set as environment variable: export GOOGLE_API_KEY="your_key_here"
MODEL = gemini-2.5-flash

[WEBPAGE_SOURCES]
# Choose from these predefined sources or add your own
WIKIPEDIA_AI = https://en.wikipedia.org/wiki/Artificial_intelligence
BBC_TECHNOLOGY = https://www.bbc.com/news/technology
CNN_BUSINESS = https://edition.cnn.com/business

[OUTPUT]
# Output file settings
OUTPUT_FILE = summary_output.txt
ENCODING = utf-8
MAX_CONTENT_LENGTH = 8000

[PROMPT]
# Prompt customization
CONTENT_TYPE = technology and business trends
TONE = analytical and insightful
SUMMARY_BULLETS = 3-5
